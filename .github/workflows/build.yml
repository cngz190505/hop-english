name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resimleri hazirla
        run: |
          pip install pillow
          python tools/prepare_images.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Android klasorunu olustur
        run: flutter create --platforms=android --org com.hopenglish --project-name hop_english .
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: hop-english-apk
          path: build/app/outputs/flutter-apk/app-release.apk
