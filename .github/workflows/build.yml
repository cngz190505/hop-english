name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Android klasorunu olustur
        run: flutter create --platforms=android --org com.hopenglish --project-name hop_english .
      - name: Uygulama ikonu
        run: |
          IM=$(command -v magick || command -v convert)
          for s in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $s
            $IM tools/app_icon.png -resize ${2}x${2} android/app/src/main/res/mipmap-$1/ic_launcher.png
          done
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: hop-english-apk
          path: build/app/outputs/flutter-apk/app-release.apk
